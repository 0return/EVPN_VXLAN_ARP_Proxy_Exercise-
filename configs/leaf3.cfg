    network-instance default {
        type default
        admin-state enable
        interface ethernet-1/1.0 {
        }
        interface ethernet-1/2.0 {
        }
        interface system0.0 {
        }
        protocols {
            bgp {
                admin-state enable
                autonomous-system 65003
                router-id 100.0.2.3
                afi-safi ipv4-unicast {
                    admin-state enable
                }
                group Spine {
                    peer-as 64999
                    export-policy [
                        export_My_IP
                    ]
                    import-policy [
                        import_Peers
                    ]
                }
                group evpnRR {
                    peer-as 65000
                    afi-safi evpn {
                        admin-state enable
                    }
                    afi-safi ipv4-unicast {
                        admin-state disable
                    }
                    local-as {
                        as-number 65000
                    }
                }
                neighbor 10.1.3.1 {
                    peer-group Spine
                }
                neighbor 10.2.3.1 {
                    peer-group Spine
                }
                neighbor 100.0.1.1 {
                    peer-group evpnRR
                }
                neighbor 100.0.1.2 {
                    peer-group evpnRR
                }
            }
        }
    }
    network-instance mac-vrf-100 {
        type mac-vrf
        interface ethernet-1/3.100 {
        }
        vxlan-interface vxlan1.100 {
        }
        protocols {
            bgp-evpn {
                bgp-instance 1 {
                    vxlan-interface vxlan1.100
                    evi 100
                    ecmp 2
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                    route-target {
                        export-rt target:65000:100
                        import-rt target:65000:100
                    }
                }
            }
        }
        bridge-table {
            proxy-arp {
                dynamic-learning {
                    admin-state enable
                }
                evpn {
                    flood {
                        unknown-arp-req true
                        gratuitous-arp true
                    }
                }
            }
        }
    }
    network-instance mac-vrf-200 {
        type mac-vrf
        interface ethernet-1/4.200 {
        }
        vxlan-interface vxlan1.200 {
        }
        protocols {
            bgp-evpn {
                bgp-instance 1 {
                    vxlan-interface vxlan1.200
                    evi 200
                    ecmp 2
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                    route-target {
                        export-rt target:65000:200
                        import-rt target:65000:200
                    }
                }
            }
        }
    }
    network-instance mgmt {
        type ip-vrf
        admin-state enable
        description "Management network instance"
        interface mgmt0.0 {
        }
        protocols {
            linux {
                import-routes true
                export-routes true
                export-neighbors true
            }
        }
    }
    routing-policy {
        prefix-set My_System_IP {
            prefix 100.0.2.3/32 mask-length-range 32..32 {
            }
        }
        prefix-set Peers {
            prefix 100.0.0.0/16 mask-length-range 32..32 {
            }
        }
        policy export_My_IP {
            default-action {
                policy-result reject
            }
            statement 10 {
                match {
                    prefix {
                        prefix-set My_System_IP
                    }
                }
                action {
                    policy-result accept
                }
            }
        }
        policy import_Peers {
            default-action {
                policy-result reject
            }
            statement 10 {
                match {
                    prefix {
                        prefix-set Peers
                    }
                }
                action {
                    policy-result accept
                }
            }
        }
    }
    interface ethernet-1/1 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 10.1.3.2/30 {
                }
            }
        }
    }
    interface ethernet-1/2 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 10.2.3.2/30 {
                }
            }
        }
    }
    interface ethernet-1/3 {
        admin-state enable
        vlan-tagging true
        subinterface 100 {
            type bridged
            admin-state enable
            vlan {
                encap {
                    single-tagged {
                        vlan-id 100
                    }
                }
            }
        }
    }
    interface ethernet-1/4 {
        admin-state enable
        vlan-tagging true
        subinterface 200 {
            type bridged
            admin-state enable
            vlan {
                encap {
                    single-tagged {
                        vlan-id 200
                    }
                }
            }
        }
    }
    interface mgmt0 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                dhcp-client {
                }
            }
            ipv6 {
                admin-state enable
                dhcp-client {
                }
            }
        }
    }
    interface system0 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 100.0.2.3/32 {
                }
            }
        }
    }
