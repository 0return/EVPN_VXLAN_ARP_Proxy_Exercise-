# =========================
# ROUTING POLICIES
# =========================

set /routing-policy prefix-set My_System_IP prefix 100.0.2.1/32 mask-length-range 32..32

set /routing-policy prefix-set Peers prefix 100.0.0.0/16 mask-length-range 32..32

set /routing-policy policy export_My_IP default-action policy-result reject
set /routing-policy policy export_My_IP statement 10 match prefix prefix-set My_System_IP
set /routing-policy policy export_My_IP statement 10 action policy-result accept

set /routing-policy policy import_Peers default-action policy-result reject
set /routing-policy policy import_Peers statement 10 match prefix prefix-set Peers
set /routing-policy policy import_Peers statement 10 action policy-result accept


# =========================
# NETWORK INSTANCE DEFAULT
# =========================

set /network-instance default type default
set /network-instance default admin-state enable

set /network-instance default interface ethernet-1/1.0
set /network-instance default interface ethernet-1/2.0
set /network-instance default interface system0.0


# =========================
# BGP
# =========================

set /network-instance default protocols bgp autonomous-system 65001
set /network-instance default protocols bgp router-id 100.0.2.1

set /network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable


# =========================
# BGP GROUP SPINES
# =========================

set /network-instance default protocols bgp group spines peer-as 64999

set /network-instance default protocols bgp group spines export-policy export_My_IP
set /network-instance default protocols bgp group spines import-policy import_Peers

set /network-instance default protocols bgp neighbor 10.1.1.1 peer-group spines
set /network-instance default protocols bgp neighbor 10.2.1.1 peer-group spines


# =========================
# BGP GROUP EVPN RR
# =========================

set /network-instance default protocols bgp group evpnRR peer-as 65000

set /network-instance default protocols bgp group evpnRR afi-safi evpn admin-state enable
set /network-instance default protocols bgp group evpnRR afi-safi ipv4-unicast admin-state disable

set /network-instance default protocols bgp group evpnRR local-as as-number 65000

set /network-instance default protocols bgp neighbor 100.0.1.1 peer-group evpnRR

# BGP UPDATE TRACE
set /network-instance default protocols bgp neighbor 100.0.1.1 trace-options flag update modifier detail

set /network-instance default protocols bgp neighbor 100.0.1.2 peer-group evpnRR


# =========================
# INTERFACE ETHERNET-1/1
# =========================

set /interface ethernet-1/1 admin-state enable
set /interface ethernet-1/1 subinterface 0 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv4 address 10.1.1.2/30


# =========================
# INTERFACE ETHERNET-1/2
# =========================

set /interface ethernet-1/2 admin-state enable
set /interface ethernet-1/2 subinterface 0 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv4 address 10.2.1.2/30


# =========================
# INTERFACE ETHERNET-1/3
# VLAN 100
# =========================

set /interface ethernet-1/3 admin-state enable
set /interface ethernet-1/3 vlan-tagging true

set /interface ethernet-1/3 subinterface 100 type bridged
set /interface ethernet-1/3 subinterface 100 admin-state enable
set /interface ethernet-1/3 subinterface 100 vlan encap single-tagged vlan-id 100


# =========================
# INTERFACE ETHERNET-1/4
# VLAN 200
# =========================

set /interface ethernet-1/4 admin-state enable
set /interface ethernet-1/4 vlan-tagging true

set /interface ethernet-1/4 subinterface 200 type bridged
set /interface ethernet-1/4 subinterface 200 vlan encap single-tagged vlan-id 200


# =========================
# SYSTEM0
# =========================

set /interface system0 admin-state enable
set /interface system0 subinterface 0 admin-state enable
set /interface system0 subinterface 0 ipv4 admin-state enable
set /interface system0 subinterface 0 ipv4 address 100.0.2.1/32


# =========================
# MAC-VRF 100
# =========================

set /network-instance mac-vrf-100 type mac-vrf
set /network-instance mac-vrf-100 interface ethernet-1/3.100
set /network-instance mac-vrf-100 vxlan-interface vxlan1.100


# BGP EVPN
set /network-instance mac-vrf-100 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.100
set /network-instance mac-vrf-100 protocols bgp-evpn bgp-instance 1 evi 100
set /network-instance mac-vrf-100 protocols bgp-evpn bgp-instance 1 ecmp 2


# BGP VPN / Route Targets
set /network-instance mac-vrf-100 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:100
set /network-instance mac-vrf-100 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:100


# =========================
# PROXY ARP - MAC-VRF 100
# =========================

set /network-instance mac-vrf-100 bridge-table proxy-arp admin-state enable

set /network-instance mac-vrf-100 bridge-table proxy-arp dynamic-learning admin-state enable

set /network-instance mac-vrf-100 bridge-table proxy-arp evpn flood unknown-arp-req true
set /network-instance mac-vrf-100 bridge-table proxy-arp evpn flood gratuitous-arp true


# =========================
# MAC-VRF 200
# =========================

set /network-instance mac-vrf-200 type mac-vrf
set /network-instance mac-vrf-200 interface ethernet-1/4.200
set /network-instance mac-vrf-200 vxlan-interface vxlan1.200


# BGP EVPN
set /network-instance mac-vrf-200 protocols bgp-evpn bgp-instance 1 admin-state enable
set /network-instance mac-vrf-200 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.200
set /network-instance mac-vrf-200 protocols bgp-evpn bgp-instance 1 evi 200
set /network-instance mac-vrf-200 protocols bgp-evpn bgp-instance 1 ecmp 2


# BGP VPN / Route Targets
set /network-instance mac-vrf-200 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:200
set /network-instance mac-vrf-200 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:200


# =========================
# NETWORK INSTANCE MGMT
# =========================

set /network-instance mgmt type ip-vrf
set /network-instance mgmt admin-state enable
set /network-instance mgmt description "Management network instance"

set /network-instance mgmt interface mgmt0.0

set /network-instance mgmt protocols linux import-routes true
set /network-instance mgmt protocols linux export-routes true
set /network-instance mgmt protocols linux export-neighbors true


# =========================
# MANAGEMENT INTERFACE
# =========================

set /interface mgmt0 admin-state enable
set /interface mgmt0 subinterface 0 admin-state enable

set /interface mgmt0 subinterface 0 ipv4 admin-state enable
set /interface mgmt0 subinterface 0 ipv4 dhcp-client

set /interface mgmt0 subinterface 0 ipv6 admin-state enable
set /interface mgmt0 subinterface 0 ipv6 dhcp-client
